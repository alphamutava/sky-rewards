    return <button onClick={disabled?undefined:onClick} style={{...base,...sizes[size],...variants[variant],...style}} {...p}>{loading?<span className="spinner"/>:null}{children}</button>;

/* ═══════════════════════════════════════════
   M-PESA STK SIMULATION MODAL
   ═══════════════════════════════════════════ */
const MpesaModal = ({type='withdraw', amount, phone:initPhone, onComplete, onClose}) => {
    const [step, setStep] = useState(1);
    const [phone, setPhone] = useState(initPhone||'');
    const [amt, setAmt] = useState(amount||'');
    const label = type==='withdraw' ? 'Withdraw to M-Pesa' : 'Deposit via M-Pesa';
    const color = type==='withdraw' ? 'var(--green)' : 'var(--blue)';
    const darkColor = type==='withdraw' ? 'rgba(16,185,129,.1)' : 'rgba(59,130,246,.1)';

    const handleSubmit = (e) => {
        e.preventDefault();
        if(type==='withdraw' && Number(amt)<500) return alert('Minimum withdrawal is KSh 500');
        if(!phone || phone.length<10) return alert('Enter a valid M-Pesa number');
        setStep(2);
        setTimeout(()=>setStep(3), 1800);
    };
    const handleConfirm = () => { setStep(4); setTimeout(()=>{ onComplete && onComplete(Number(amt)); }, 1500); };

    return (
        <Modal onClose={onClose} width={440}>
            {step===1 && (
                <form onSubmit={handleSubmit}>
                    <div style={{width:48,height:48,borderRadius:'50%',background:darkColor,display:'flex',alignItems:'center',justifyContent:'center',marginBottom:20,border:`1px solid ${color}33`}}>
                        <Icons.dollar size={22} color={color}/>
                    </div>
                    <h3 style={{fontSize:36,marginBottom:4}}>{label.toUpperCase()}</h3>
                    <p style={{color:'var(--muted)',marginBottom:24,fontSize:14,fontWeight:500}}>{type==='withdraw'?'Send earnings to your M-Pesa instantly':'Fund your campaign wallet'}</p>
                    <Input label="M-Pesa Phone Number" type="tel" placeholder="07XXXXXXXX" value={phone} onChange={e=>setPhone(e.target.value)} required/>
                    <Input label={`Amount (KSh)${type==='withdraw'?' — Min 500':''}`} type="number" min={type==='withdraw'?500:1000} placeholder={type==='withdraw'?'5000':'50000'} value={amt} onChange={e=>setAmt(e.target.value)} required/>
                    <Btn variant={type==='withdraw'?'green':'primary'} size="lg" style={{width:'100%',marginTop:8}}>{label}</Btn>
                </form>
            )}
            {step===2 && (
                <div style={{textAlign:'center',padding:'40px 0'}}>
                    <div className="spinner" style={{width:48,height:48,borderWidth:4,borderTopColor:color,margin:'0 auto 24px'}}/>
                    <p style={{fontSize:18,fontWeight:700}} className="animate-pulse">Sending M-Pesa prompt to {phone}...</p>
                    <p style={{color:'var(--muted)',marginTop:8,fontSize:14}}>Please wait</p>
                </div>
            )}
            {step===3 && (
                <div className="animate-slide" style={{background:'#e2e8f0',borderRadius:20,padding:24,color:'#0f172a'}}>
                    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}><Icons.phone size={18} color="#0f172a"/> <strong>SIM Toolkit</strong></div>
                    <p style={{fontWeight:500,fontSize:15,marginBottom:20,lineHeight:1.5}}>
                        {type==='withdraw' 
                            ? `Do you want to receive Ksh ${Number(amt).toLocaleString()} from SK KENYA? Enter M-PESA PIN`
                            : `Do you want to pay Ksh ${Number(amt).toLocaleString()} to SK KENYA PAYBILL 247247? Enter M-PESA PIN`
                        }
                    </p>
                    <input type="password" placeholder="Enter PIN" style={{width:'100%',background:'#fff',border:'1px solid #d1d5db',borderRadius:8,padding:'10px 14px',marginBottom:20,outline:'none',fontSize:15,fontFamily:'monospace'}}/>
                    <div style={{display:'flex',justifyContent:'flex-end',gap:24,fontWeight:700,fontSize:15}}>
                        <span onClick={onClose} style={{color:'#dc2626',cursor:'pointer'}}>Cancel</span>
                        <span onClick={handleConfirm} style={{color:'#0284c7',cursor:'pointer'}}>OK</span>
                    </div>
                </div>
            )}
            {step===4 && (
                <div className="animate-slide" style={{textAlign:'center',padding:'32px 0'}}>
                    <div style={{width:72,height:72,borderRadius:'50%',background:darkColor,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px',border:`2px solid ${color}`}}>
                        <Icons.checkCircle size={36} color={color}/>
                    </div>
                    <h3 style={{fontSize:40,marginBottom:8}}>{type==='withdraw'?'PAYMENT SENT!':'DEPOSIT RECEIVED!'}</h3>
                    <p style={{color:'var(--muted)',fontSize:16,marginBottom:24}}>{KSh(amt)} {type==='withdraw'?'sent to your M-Pesa':'added to your wallet'}</p>
                    <Btn variant="ghost" onClick={onClose}>Close</Btn>
                </div>
            )}
        </Modal>
    );
};

/* ═══════════════════════════════════════════
   SUBMIT CONTENT MODAL
   ═══════════════════════════════════════════ */
const SubmitModal = ({campaigns, currentUser, onSubmit, onClose}) => {
    const [campaignId, setCampaignId] = useState('');
    const [url, setUrl] = useState('');
    const [platform, setPlatform] = useState('');
    const [submitting, setSubmitting] = useState(false);
    const activeCampaigns = campaigns.filter(c=>c.status==='ACTIVE');
    const selected = activeCampaigns.find(c=>c.id===campaignId);

    const handleSubmit = (e) => {
        e.preventDefault();
        if(!campaignId || !url) return;
        setSubmitting(true);
        const detectedPlatform = platform || detectPlatform(url);
        const fakeViews = Math.floor(Math.random()*50000)+1000;
        let earned = (fakeViews/1000)*selected.rate;
        if(selected.bonus) earned += selected.bonus;

        setTimeout(()=>{
            onSubmit({
                id: uid(), campaignId, campaignName: selected.title, creatorId: currentUser.id, creatorName: currentUser.name,
                videoUrl: url, platform: detectedPlatform, views: fakeViews, status:'PENDING', earned: Math.round(earned), submittedAt: new Date().toISOString()
            });
            setSubmitting(false);
            onClose();
        }, 1200);
    };

    return (
        <Modal onClose={onClose} width={560}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}><Icons.link size={22} color="var(--primary)"/><h3 style={{fontSize:36}}>SUBMIT CONTENT</h3></div>
            <p style={{color:'var(--muted)',marginBottom:24,fontSize:14}}>Paste your video link and we'll verify views automatically.</p>
            
            {selected && (
                <div style={{background:'rgba(249,115,22,.08)',border:'1px solid rgba(249,115,22,.2)',borderRadius:14,padding:16,marginBottom:20,fontSize:13}}>
                    <strong style={{color:'var(--primary)'}}>Earnings Formula:</strong><br/>
                    <span style={{color:'#ccc'}}>(Views ÷ 1,000) × {KSh(selected.rate)}{selected.bonus ? ` + ${KSh(selected.bonus)} flat bonus` : ''}</span><br/>
                    <span style={{color:'var(--muted)',fontSize:12}}>Example: 2,000 views × {KSh(selected.rate)}/1k{selected.bonus?` + ${KSh(selected.bonus)} bonus`:''} = {KSh((2000/1000)*selected.rate + (selected.bonus||0))}</span>
                </div>
            )}

            <form onSubmit={handleSubmit}>
                <Select label="Select Campaign" value={campaignId} onChange={e=>setCampaignId(e.target.value)} required>
                    <option value="">Choose a campaign...</option>
                    {activeCampaigns.map(c=><option key={c.id} value={c.id}>{c.brandName} — {c.title} ({KSh(c.rate)}/1k)</option>)}
                </Select>
                <Input label="Video URL" type="url" placeholder="https://www.tiktok.com/@you/video/123..." value={url} onChange={e=>{setUrl(e.target.value); setPlatform(detectPlatform(e.target.value));}} required/>
                {selected && (
                    <Select label="Platform" value={platform||detectPlatform(url)} onChange={e=>setPlatform(e.target.value)}>
                        {selected.platforms.map(p=><option key={p} value={p}>{p}</option>)}
                    </Select>
                )}
                <p style={{fontSize:12,color:'var(--muted)',marginBottom:16}}>📊 Views are verified automatically over a 30-day period. Bot views are disqualified.</p>
                <Btn variant="primary" size="lg" style={{width:'100%'}} loading={submitting} disabled={submitting}>{submitting?'Verifying & Submitting...':'Submit for Review'}</Btn>
            </form>
        </Modal>
    );
};

const CreateCampaignModal = ({currentUser, onSubmit, onClose}) => {

                    </div>
                </div>
                <Select label="Category" value={f.category} onChange={e=>upd('category',e.target.value)}>
                    {['Tech','Finance','Music','Food','Fashion','Sports','Entertainment'].map(c=><option key={c}>{c}</option>)}

                <Input label="Total Campaign Budget (KSh)" type="number" min="10000" placeholder="100000" value={f.budget} onChange={e=>upd('budget',e.target.value)} required/>
                <Input label="Flat Fee Bonus per Approval (KSh) — Optional" type="number" placeholder="0" value={f.bonus} onChange={e=>upd('bonus',e.target.value)}/>

                </div>
                <p style={{fontSize:13,color:'var(--muted)',marginBottom:20}}>💰 {KSh(f.budget)} will be reserved from your wallet. Campaign goes LIVE immediately after deposit.</p>
                <div style={{display:'flex',gap:8}}>
                    <Btn variant="ghost" onClick={()=>setStep(3)} style={{flex:1}}>← Back</Btn>
                    <Btn variant="primary" size="lg" style={{flex:2}} loading={depositing} disabled={depositing} onClick={handleDeposit}>{depositing?'Depositing & Launching...':` Deposit ${KSh(f.budget)} & Launch`}</Btn>
                </div>
            </>}
        </Modal>
    );
};

/* ═══════════════════════════════════════════
   MINI CHART (Earnings Line — pure SVG)
   ═══════════════════════════════════════════ */
const EarningsChart = ({data=[]}) => {
    if(data.length===0) data = [1200,3400,2800,5600,4200,7800,6500,8750];
    const max = Math.max(...data);
    const w=600, h=200, px=40, py=20;
    const cw = w-px*2, ch = h-py*2;
    const points = data.map((v,i) => ({ x: px + (i/(data.length-1))*cw, y: py + ch - (v/max)*ch }));
    const line = points.map((p,i)=>i===0?`M${p.x},${p.y}`:`L${p.x},${p.y}`).join(' ');
    const area = line + ` L${points[points.length-1].x},${h-py} L${points[0].x},${h-py} Z`;

    return (
        <div style={{background:'var(--card)', border:'1px solid var(--border)', borderRadius:20, padding:24}}>
            <h4 style={{fontSize:18,marginBottom:16,fontFamily:'"DM Sans",sans-serif',fontWeight:700}}>Earnings (Last 8 Weeks)</h4>
            <svg viewBox={`0 0 ${w} ${h}`} style={{width:'100%',height:'auto'}}>
                <defs><linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--primary)" stopOpacity=".3"/><stop offset="100%" stopColor="var(--primary)" stopOpacity="0"/></linearGradient></defs>
                {[0,.25,.5,.75,1].map(f=><line key={f} x1={px} y1={py+ch*f} x2={w-px} y2={py+ch*f} stroke="#222" strokeWidth="1"/>)}
                <path d={area} fill="url(#areaG)"/>
                <path d={line} fill="none" stroke="var(--primary)" strokeWidth="2.5" strokeLinejoin="round"/>
                {points.map((p,i)=><circle key={i} cx={p.x} cy={p.y} r="4" fill="var(--primary)" stroke="var(--card)" strokeWidth="2"/>)}
                {data.map((v,i)=><text key={i} x={points[i].x} y={points[i].y-12} fill="#aaa" fontSize="10" textAnchor="middle" fontFamily="DM Sans">{KSh(v)}</text>)}
            </svg>
        </div>
    );
};

};

                <select value={sort} onChange={e=>setSort(e.target.value)} style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:12,padding:'8px 16px',color:'#fff',fontSize:13,fontWeight:700,outline:'none',fontFamily:'DM Sans',appearance:'none',cursor:'pointer'}}>

                            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12}}>
                                <div style={{display:'flex',alignItems:'center',gap:12}}>
                                    <div style={{width:48,height:48,background:'#000',border:'1px solid var(--border2)',borderRadius:14,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'"Bebas Neue",sans-serif',fontSize:20}}>{c.brandName.substring(0,2).toUpperCase()}</div>
                                    <div>
                                        <div style={{fontWeight:700,fontSize:16}}>{c.brandName}</div>
                                        <div style={{display:'flex',gap:6,marginTop:4}}><Badge color={c.type==='UGC'?'purple':'gray'}>{c.type}</Badge><Badge>{c.category}</Badge></div>

                                <div style={{fontFamily:'"Bebas Neue",sans-serif',fontSize:40,color:'var(--primary)',lineHeight:1}}>{KSh(c.rate)} <span style={{fontSize:13,color:'var(--muted)',fontFamily:'"DM Sans",sans-serif',fontWeight:400}}>/1k views</span></div>
                                {c.bonus>0 && <div style={{fontSize:12,fontWeight:700,color:'var(--green)',marginTop:6}}>+ {KSh(c.bonus)} flat bonus per approval</div>}

};

const CreatorDashPage = ({db, user, syncDb}) => {

    const mySubs = db.submissions.filter(s=>s.creatorId===user.id);
    const approved = mySubs.filter(s=>s.status==='APPROVED');
    const totalEarned = approved.reduce((s,x)=>s+x.earned,0);
    const pendingEarned = mySubs.filter(s=>s.status==='PENDING'||s.status==='UNDER_REVIEW').reduce((s,x)=>s+x.earned,0);
    const totalViews = mySubs.reduce((s,x)=>s+x.views,0);

    const handleNewSubmission = (sub) => { syncDb({...db, submissions:[sub,...db.submissions], notifications:[{id:uid(),userId:user.id,message:`Submission for ${sub.campaignName} received! Views: ${shortNum(sub.views)}`,read:false,createdAt:new Date().toISOString(),type:'info'},...db.notifications]}); };

                <StatCard label="Available Balance" value={KSh(user.balance)} icon={Icons.wallet} color="var(--primary)"/>
                <StatCard label="Total Earned" value={KSh(totalEarned)} icon={Icons.trending}/>
                <StatCard label="Pending Approval" value={KSh(pendingEarned)} icon={Icons.clock} color="var(--yellow)"/>

                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:14,whiteSpace:'nowrap'}}>

                                <tr key={s.id} style={{borderBottom:'1px solid var(--border)'}}>

/* ═══════════════════════════════════════════
   PAGE: BRAND DASHBOARD
   ═══════════════════════════════════════════ */
const BrandDashPage = ({db, user, syncDb}) => {
    const [showCreate, setShowCreate] = useState(false);
    const [showDeposit, setShowDeposit] = useState(false);
    const myCamps = db.campaigns.filter(c=>c.brandId===user.id);
    const mySubs = db.submissions.filter(s=>myCamps.some(c=>c.id===s.campaignId));
    const pendingCount = mySubs.filter(s=>s.status==='PENDING'||s.status==='UNDER_REVIEW').length;
    const totalSpent = myCamps.reduce((s,c)=>s+c.spent,0);
    const totalViews = mySubs.filter(s=>s.status==='APPROVED').reduce((s,x)=>s+x.views,0);

    const handleApprove = (sub) => {
        const camp = myCamps.find(c=>c.id===sub.campaignId);
        if(camp && camp.spent+sub.earned>camp.budget) return alert('Campaign budget exhausted! Top up first.');
        const newSubs = db.submissions.map(s=>s.id===sub.id?{...s,status:'APPROVED'}:s);
        const newCamps = db.campaigns.map(c=>c.id===sub.campaignId?{...c,spent:c.spent+sub.earned}:c);
        const newUsers = db.users.map(u=>u.id===sub.creatorId?{...u,balance:u.balance+sub.earned}:u);
        const newNotifs = [{id:uid(),userId:sub.creatorId,message:`Your ${sub.campaignName} submission was APPROVED! +${KSh(sub.earned)} 🎉`,read:false,createdAt:new Date().toISOString(),type:'success'},...db.notifications];
        syncDb({...db,submissions:newSubs,campaigns:newCamps,users:newUsers,notifications:newNotifs});
    };
    const handleReject = (sub) => {
        const newSubs = db.submissions.map(s=>s.id===sub.id?{...s,status:'REJECTED',earned:0}:s);
        const newNotifs = [{id:uid(),userId:sub.creatorId,message:`Your ${sub.campaignName} submission was REJECTED.`,read:false,createdAt:new Date().toISOString(),type:'error'},...db.notifications];
        syncDb({...db,submissions:newSubs,notifications:newNotifs});
    };
    const handleFlag = (sub) => {
        const newSubs = db.submissions.map(s=>s.id===sub.id?{...s,status:'FLAGGED'}:s);
        syncDb({...db,submissions:newSubs});
    };
    const handlePause = (camp) => {
        const newCamps = db.campaigns.map(c=>c.id===camp.id?{...c,status:c.status==='ACTIVE'?'PAUSED':'ACTIVE'}:c);
        syncDb({...db,campaigns:newCamps});
    };
    const handleCreateCampaign = (camp, budgetAmt) => {
        const newUsers = db.users.map(u=>u.id===user.id?{...u,balance:u.balance-budgetAmt}:u);
        syncDb({...db, campaigns:[camp,...db.campaigns], users:newUsers});
    };
    const handleDeposit = (amt) => {
        const newUsers = db.users.map(u=>u.id===user.id?{...u,balance:u.balance+amt}:u);
        syncDb({...db, users:newUsers});
    };
    const bulkApprove = () => {
        const pending = mySubs.filter(s=>s.status==='PENDING');
        let newDb = {...db};
        pending.forEach(sub => {
            const camp = myCamps.find(c=>c.id===sub.campaignId);
            if(camp && camp.spent+sub.earned<=camp.budget) {
                newDb = {...newDb, submissions: newDb.submissions.map(s=>s.id===sub.id?{...s,status:'APPROVED'}:s), campaigns: newDb.campaigns.map(c=>c.id===sub.campaignId?{...c,spent:c.spent+sub.earned}:c), users: newDb.users.map(u=>u.id===sub.creatorId?{...u,balance:u.balance+sub.earned}:u), notifications: [{id:uid(),userId:sub.creatorId,message:`Your ${sub.campaignName} submission was APPROVED! +${KSh(sub.earned)} 🎉`,read:false,createdAt:new Date().toISOString(),type:'success'},...newDb.notifications] };
            }
        });
        syncDb(newDb);
    };

    return (
        <div className="animate-fade" style={{maxWidth:1200,margin:'0 auto',padding:'100px 24px 80px'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-end',flexWrap:'wrap',gap:16,marginBottom:32}}>
                <div>
                    <h1 style={{fontSize:44,marginBottom:4}}>BRAND DASHBOARD</h1>
                    <p style={{color:'var(--muted)',fontWeight:500}}>{user.name} — Campaign Management</p>
                </div>
                <div style={{display:'flex',gap:12}}>
                    <Btn variant="ghost" onClick={()=>setShowDeposit(true)} style={{fontFamily:'monospace'}}>{KSh(user.balance)} (Top Up)</Btn>
                    <Btn variant="primary" onClick={()=>setShowCreate(true)} style={{boxShadow:'0 0 15px rgba(249,115,22,.3)'}}><Icons.plus size={16}/> Create Campaign</Btn>
                </div>
            </div>

            <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:16,marginBottom:32}}>
                <StatCard label="Campaigns" value={myCamps.length} icon={Icons.grid}/>
                <StatCard label="Total Views" value={shortNum(totalViews)} icon={Icons.eye} color="var(--primary)"/>
                <StatCard label="Total Spent" value={KSh(totalSpent)} icon={Icons.trending}/>
                <StatCard label="Wallet" value={KSh(user.balance)} icon={Icons.wallet} color="var(--green)"/>
                <StatCard label="Pending Review" value={pendingCount} icon={Icons.clock} color="var(--yellow)"/>
            </div>

            {/* Campaigns List */}
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,overflow:'hidden',marginBottom:32}}>
                <div style={{padding:'20px 24px',borderBottom:'1px solid var(--border)',background:'#0c0c0c'}}><h3 style={{fontSize:18,fontFamily:'"DM Sans",sans-serif',fontWeight:700}}>My Campaigns</h3></div>
                <div style={{padding:20,display:'flex',flexDirection:'column',gap:12}}>
                    {myCamps.length===0?<p style={{color:'var(--muted)',textAlign:'center',padding:40}}>No campaigns yet. Create your first!</p>:
                    myCamps.map(c=>{
                        const prog = pct(c.spent,c.budget);
                        const campSubs = db.submissions.filter(s=>s.campaignId===c.id);
                        return (
                            <div key={c.id} style={{background:'#0a0a0a',border:'1px solid var(--border)',borderRadius:16,padding:20}}>
                                <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:12,flexWrap:'wrap',gap:8}}>
                                    <div><h4 style={{fontSize:18,fontFamily:'"DM Sans",sans-serif',fontWeight:700,marginBottom:4}}>{c.title}</h4><span style={{fontSize:13,color:'var(--muted)',fontFamily:'monospace'}}>{KSh(c.rate)}/1k &bull; {c.type} &bull; {campSubs.length} subs</span></div>
                                    <div style={{display:'flex',gap:8,alignItems:'center'}}><StatusBadge status={c.status}/><Btn size="sm" variant={c.status==='ACTIVE'?'danger':'green'} onClick={()=>handlePause(c)}>{c.status==='ACTIVE'?'Pause':'Resume'}</Btn></div>
                                </div>
                                <div style={{display:'flex',justifyContent:'space-between',fontSize:12,color:'var(--muted)',fontWeight:700,marginBottom:6}}><span>{KSh(c.spent)} / {KSh(c.budget)}</span><span>{prog}%</span></div>
                                <ProgressBar value={prog} color={prog>=90?'var(--red)':'var(--primary)'}/>
                            </div>
                        );
                    })}
                </div>
            </div>

            {/* Submissions Review */}
            <div style={{background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,overflow:'hidden'}}>
                <div style={{padding:'20px 24px',borderBottom:'1px solid var(--border)',background:'#0c0c0c',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                    <h3 style={{fontSize:18,fontFamily:'"DM Sans",sans-serif',fontWeight:700,display:'flex',alignItems:'center',gap:8}}>Submissions Inbox <Badge color="orange">{pendingCount} pending</Badge></h3>
                    {pendingCount>0 && <Btn size="sm" variant="primary" onClick={bulkApprove}><Icons.check size={14}/> Bulk Approve All</Btn>}
                </div>
                <p style={{padding:'12px 24px',fontSize:12,color:'var(--muted)',borderBottom:'1px solid var(--border)',background:'#0f0f0f'}}>⏱ Submissions auto-approve after 48 hours unless flagged</p>
                <div style={{overflowX:'auto'}}>
                    <table style={{width:'100%',borderCollapse:'collapse',fontSize:14,whiteSpace:'nowrap'}}>
                        <thead><tr style={{background:'#0a0a0a'}}>
                            {['Creator','Campaign','Platform','Views','Earned','Status','Actions'].map(h=><th key={h} style={{padding:'12px 16px',textAlign:'left',fontSize:11,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1}}>{h}</th>)}
                        </tr></thead>
                        <tbody>
                            {mySubs.length===0?<tr><td colSpan={7} style={{padding:40,textAlign:'center',color:'var(--muted)'}}>No submissions yet.</td></tr>:
                            mySubs.map(s=>(
                                <tr key={s.id} style={{borderBottom:'1px solid var(--border)'}}>
                                    <td style={{padding:'12px 16px',fontWeight:600}}>{s.creatorName}</td>
                                    <td style={{padding:'12px 16px'}}>{s.campaignName}</td>
                                    <td style={{padding:'12px 16px'}}><PlatformBadge platform={s.platform}/></td>
                                    <td style={{padding:'12px 16px',fontFamily:'monospace'}}>{s.views.toLocaleString()}</td>
                                    <td style={{padding:'12px 16px',fontFamily:'monospace',color:'var(--primary)',fontWeight:700}}>{KSh(s.earned)}</td>
                                    <td style={{padding:'12px 16px'}}><StatusBadge status={s.status}/></td>
                                    <td style={{padding:'12px 16px'}}>
                                        {(s.status==='PENDING'||s.status==='UNDER_REVIEW') && (
                                            <div style={{display:'flex',gap:6}}>
                                                <button onClick={()=>handleApprove(s)} title="Approve" style={{width:32,height:32,borderRadius:'50%',border:'1px solid var(--primary)',background:'rgba(249,115,22,.1)',color:'var(--primary)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icons.check size={14}/></button>
                                                <button onClick={()=>handleReject(s)} title="Reject" style={{width:32,height:32,borderRadius:'50%',border:'1px solid var(--border)',background:'transparent',color:'#888',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icons.x size={14}/></button>
                                                <button onClick={()=>handleFlag(s)} title="Flag" style={{width:32,height:32,borderRadius:'50%',border:'1px solid var(--border)',background:'transparent',color:'#888',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center'}}><Icons.flag size={14}/></button>
                                            </div>
                                        )}
                                        {s.status==='APPROVED' && <span style={{color:'var(--green)',fontSize:12,fontWeight:700}}>✓ Paid</span>}
                                        {s.status==='REJECTED' && <span style={{color:'var(--red)',fontSize:12,fontWeight:700}}>✗ Rejected</span>}
                                    </td>
                                </tr>
                            ))}
                        </tbody>
                    </table>

            </div>

            {showCreate && <CreateCampaignModal currentUser={user} onSubmit={handleCreateCampaign} onClose={()=>setShowCreate(false)}/>}

        </div>
    );
};

/* ═══════════════════════════════════════════
   MAIN APP (Router + State)
   ═══════════════════════════════════════════ */
const App = () => {
    const [ready, setReady] = useState(false);
    const [view, setView] = useState('home');
    const [currentUser, setCurrentUser] = useState(null);
    const [db, setDb] = useState({users:[],campaigns:[],submissions:[],notifications:[]});
    const [showMobileMenu, setShowMobileMenu] = useState(false);
    const [showNotifs, setShowNotifs] = useState(false);
    const [showUserMenu, setShowUserMenu] = useState(false);

    // Init
    useEffect(()=>{
        if(!localStorage.getItem('sk_init')){
            DB.set('users',SEED.users); DB.set('campaigns',SEED.campaigns); DB.set('submissions',SEED.submissions); DB.set('notifications',SEED.notifications);
            localStorage.setItem('sk_init','2');
        }
        const d = {users:DB.get('users'),campaigns:DB.get('campaigns'),submissions:DB.get('submissions'),notifications:DB.get('notifications')};
        setDb(d);
        setCurrentUser(d.users.find(u=>u.type==='creator')||d.users[0]);
        setReady(true);
    },[]);

    const syncDb = useCallback((newDb)=>{
        setDb(newDb);
        DB.set('users',newDb.users); DB.set('campaigns',newDb.campaigns); DB.set('submissions',newDb.submissions); DB.set('notifications',newDb.notifications);
        // Refresh currentUser from new data
        setCurrentUser(prev => newDb.users.find(u=>u.id===prev?.id)||prev);
    },[]);

    const nav = useCallback((v)=>{ setView(v); setShowMobileMenu(false); setShowNotifs(false); setShowUserMenu(false); window.scrollTo(0,0); },[]);
    const handleSubmission = (sub)=>{ syncDb({...db, submissions:[sub,...db.submissions]}); };

    const myNotifs = useMemo(()=>db.notifications.filter(n=>n.userId===currentUser?.id),[db.notifications,currentUser]);
    const unread = myNotifs.filter(n=>!n.read).length;

    const markRead = ()=>{ syncDb({...db, notifications:db.notifications.map(n=>n.userId===currentUser?.id?{...n,read:true}:n)}); };

    if(!ready) return <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner" style={{width:40,height:40,borderWidth:4,borderTopColor:'var(--primary)'}}/></div>;

    return (
        <div>
            {/* ─── NAVBAR ─── */}
            <nav style={{position:'fixed',top:0,width:'100%',zIndex:100,background:'rgba(10,10,10,.9)',backdropFilter:'blur(12px)',borderBottom:'1px solid var(--border)',height:72,display:'flex',alignItems:'center',padding:'0 24px'}}>
                <div style={{maxWidth:1200,width:'100%',margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
                    <div style={{display:'flex',alignItems:'center',gap:32}}>
                        <div onClick={()=>nav('home')} style={{display:'flex',alignItems:'center',gap:10,cursor:'pointer'}}>
                            <div style={{width:40,height:40,background:'var(--primary)',borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'"Bebas Neue",sans-serif',fontSize:20,color:'#fff',boxShadow:'0 0 15px rgba(249,115,22,.3)'}}>SK</div>
                            <span style={{fontFamily:'"Bebas Neue",sans-serif',fontSize:22,letterSpacing:3}}>SK KENYA</span>
                        </div>
                        <div className="nav-links" style={{display:'flex',gap:24}}>
                            {[{k:'discover',l:'Discover'},{k:'how',l:'How It Works'},{k:'verify',l:'Verify'}].map(l=>(
                                <button key={l.k} onClick={()=>nav(l.k)} style={{background:'none',border:'none',color:view===l.k?'var(--primary)':'#888',cursor:'pointer',fontSize:14,fontWeight:700,fontFamily:'DM Sans',textTransform:'uppercase',letterSpacing:.5,transition:'color .2s'}}>{l.l}</button>
                            ))}
                        </div>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:12}}>
                        {/* Notifs */}
                        <div style={{position:'relative'}}>
                            <button onClick={()=>{setShowNotifs(!showNotifs);if(!showNotifs)markRead();setShowUserMenu(false);}} style={{background:'none',border:'none',cursor:'pointer',color:'#aaa',padding:8,borderRadius:12,position:'relative'}}>
                                <Icons.bell size={20}/>
                                {unread>0 && <span style={{position:'absolute',top:4,right:4,width:10,height:10,background:'var(--red)',borderRadius:'50%',border:'2px solid #0a0a0a'}}/>}
                            </button>
                            {showNotifs && (
                                <div style={{position:'absolute',top:48,right:0,width:360,background:'var(--card)',border:'1px solid var(--border)',borderRadius:20,boxShadow:'0 20px 40px rgba(0,0,0,.6)',padding:8,zIndex:200,maxHeight:420,overflowY:'auto'}}>
                                    <div style={{padding:'12px 16px',fontSize:12,fontWeight:700,color:'var(--muted)',textTransform:'uppercase',letterSpacing:1}}>Notifications</div>
                                    {myNotifs.length===0?<div style={{padding:24,textAlign:'center',color:'var(--muted)',fontSize:14}}>No notifications</div>:
                                    myNotifs.slice(0,8).map(n=>(
                                        <div key={n.id} style={{padding:'12px 16px',borderRadius:12,background:n.read?'transparent':'rgba(249,115,22,.05)',marginBottom:2,borderLeft:`3px solid ${n.type==='success'?'var(--green)':n.type==='error'?'var(--red)':n.type==='warning'?'var(--yellow)':'var(--primary)'}`,cursor:'default'}}>
                                            <div style={{fontSize:14,lineHeight:1.4}}>{n.message}</div>
                                            <div style={{fontSize:11,color:'var(--muted)',marginTop:4}}>{ago(n.createdAt)}</div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                        {/* User Menu */}
                        <div style={{position:'relative'}}>
                            <button onClick={()=>{setShowUserMenu(!showUserMenu);setShowNotifs(false);}} style={{display:'flex',alignItems:'center',gap:8,background:'rgba(255,255,255,.06)',border:'1px solid var(--border)',borderRadius:50,padding:'6px 16px 6px 6px',cursor:'pointer',color:'#fff',fontFamily:'DM Sans',fontWeight:700,fontSize:13}}>
                                <div style={{width:28,height:28,borderRadius:'50%',background:'var(--primary)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:800}}>{currentUser?.avatar?.substring(0,2)||'?'}</div>
                                {currentUser?.name}
                            </button>
                            {showUserMenu && (
                                <div style={{position:'absolute',top:48,right:0,width:220,background:'var(--card)',border:'1px solid var(--border)',borderRadius:16,boxShadow:'0 20px 40px rgba(0,0,0,.6)',padding:8,zIndex:200}}>
                                    <div style={{padding:'8px 12px',fontSize:10,fontWeight:700,color:'var(--muted2)',textTransform:'uppercase',letterSpacing:1.5}}>Switch Account</div>
                                    {db.users.map(u=>(
                                        <button key={u.id} onClick={()=>{setCurrentUser(u);setShowUserMenu(false);nav(u.type==='creator'?'c-dash':u.type==='brand'?'b-dash':'admin');}} style={{width:'100%',textAlign:'left',padding:'10px 12px',borderRadius:10,border:'none',background:currentUser?.id===u.id?'rgba(249,115,22,.1)':'transparent',color:currentUser?.id===u.id?'var(--primary)':'#ccc',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'DM Sans',display:'flex',alignItems:'center',gap:8}}>
                                            <div style={{width:24,height:24,borderRadius:'50%',background:u.type==='creator'?'var(--primary)':u.type==='brand'?'var(--blue)':'var(--red)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:9,fontWeight:800,color:'#fff'}}>{u.avatar?.substring(0,2)}</div>
                                            {u.name} <span style={{color:'var(--muted2)',fontSize:11,marginLeft:'auto'}}>({u.type})</span>
                                        </button>
                                    ))}
                                    <div style={{height:1,background:'var(--border)',margin:'6px 0'}}/>
                                    {currentUser?.type==='creator' && <button onClick={()=>{setShowUserMenu(false);nav('c-dash');}} style={{width:'100%',textAlign:'left',padding:'10px 12px',borderRadius:10,border:'none',background:'transparent',color:'#ccc',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'DM Sans'}}>Creator Dashboard</button>}
                                    {currentUser?.type==='brand' && <button onClick={()=>{setShowUserMenu(false);nav('b-dash');}} style={{width:'100%',textAlign:'left',padding:'10px 12px',borderRadius:10,border:'none',background:'transparent',color:'#ccc',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'DM Sans'}}>Brand Dashboard</button>}
                                    {currentUser?.type==='creator' && <button onClick={()=>{setShowUserMenu(false);nav('profile');}} style={{width:'100%',textAlign:'left',padding:'10px 12px',borderRadius:10,border:'none',background:'transparent',color:'#ccc',cursor:'pointer',fontSize:13,fontWeight:600,fontFamily:'DM Sans'}}>My Profile</button>}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            </nav>

            {/* ─── PAGES ─── */}
            <div onClick={()=>{setShowNotifs(false);setShowUserMenu(false);}}>
                {view==='home' && <HomePage nav={nav} campaigns={db.campaigns}/>}
                {view==='discover' && <DiscoverPage campaigns={db.campaigns} currentUser={currentUser} onSubmit={handleSubmission}/>}
                {view==='c-dash' && <CreatorDashPage db={db} user={currentUser?.type==='creator'?currentUser:db.users.find(u=>u.type==='creator')} syncDb={syncDb}/>}
                {view==='b-dash' && <BrandDashPage db={db} user={currentUser?.type==='brand'?currentUser:db.users.find(u=>u.type==='brand')} syncDb={syncDb}/>}
                {view==='how' && <HowItWorksPage/>}
                {view==='verify' && <VerifyPage/>}
                {view==='profile' && <CreatorProfilePage user={currentUser} db={db}/>}
                {view==='admin' && <AdminPage db={db} syncDb={syncDb}/>}
            </div>
